<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Trailman100 Membership Portal</title>
  <style>
    body { font-family: sans-serif; display: flex; justify-content: center; margin: 40px; }
    .container { max-width: 600px; width: 100%; }
    .hidden { display: none; }
    input { width: 100%; padding: 8px; margin: 8px 0; box-sizing: border-box; }
    button { padding: 10px 15px; background: #0056b3; color: white; border: none; cursor: pointer; }
    button:hover { background: #004085; }
    canvas { width: 100%; border: 1px dashed #ccc; margin-top: 15px; }
  </style>
</head>
<body>
  <div class="container">
    <h1>Trailman100 Portal</h1>

    <!-- Authentication Screen -->
    <div id="auth-section">
      <h3>Member Login</h3>
      <input type="email" id="email" placeholder="Email Address">
      <input type="password" id="password" placeholder="Password">
      <button id="btn-login">Login</button>
      <button id="btn-reset" style="background:#6c757d;">Reset Password</button>
    </div>

    <!-- Member Portal Screen -->
    <div id="portal-section" class="hidden">
      <h3>Welcome, <span id="member-display-name">Member</span>!</h3>
      <button id="btn-logout" style="background:#dc3545;">Logout</button>
      
      <h4>Personal Information</h4>
      <label>Full Name:</label>
      <input type="text" id="profile-name" placeholder="John Doe">
      
      <label>Membership Number:</label>
      <input type="text" id="profile-number" readonly>
      
      <button id="btn-update">Update Info & Card</button>

      <h4>Your Membership Card</h4>
      <canvas id="card-canvas" width="600" height="350"></canvas>
      <br><br>
      <button id="btn-download" style="background:#28a745;">Download Card Image</button>
    </div>
  </div>

  <script type="module" src="app.js"></script>
</body>
</html>
