<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Trailman100 - Login</title>
  <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-gray-100 flex items-center justify-center min-h-screen">
  <div class="bg-white p-8 rounded-xl shadow-md w-full max-w-md">
    <h2 class="text-2xl font-bold text-gray-800 text-center mb-6">Trailman100 Login</h2>
    
    <div class="space-y-4">
      <div>
        <label class="block text-sm font-medium text-gray-700 mb-1">Email Address</label>
        <input type="email" id="email" class="w-full px-4 py-2 border border-gray-300 rounded-lg focus:ring-2 focus:ring-blue-500 focus:outline-none" required>
      </div>
      <div>
        <label class="block text-sm font-medium text-gray-700 mb-1">Password</label>
        <input type="password" id="password" class="w-full px-4 py-2 border border-gray-300 rounded-lg focus:ring-2 focus:ring-blue-500 focus:outline-none" required>
      </div>
      
      <button id="loginBtn" class="w-full py-2 bg-blue-600 hover:bg-blue-700 text-white font-semibold rounded-lg transition duration-200">Sign In</button>
      
      <div class="text-center mt-4">
        <button id="forgotPasswordBtn" class="text-sm text-blue-600 hover:underline">Forgot Password?</button>
      </div>
      
      <p id="message" class="text-center text-sm font-medium mt-4"></p>
    </div>
  </div>

  <script type="module">
    import { initializeApp } from "https://www.gstatic.com/firebasejs/10.0.0/firebase-app.js";
    import { getAuth, signInWithEmailAndPassword, sendPasswordResetEmail } from "https://www.gstatic.com/firebasejs/10.0.0/firebase-auth.js";

    const firebaseConfig = {
  apiKey: "AIzaSyA_XnffybaryptukW63qojheCXy4terHqM",
  authDomain: "trailman100-membersip-system.firebaseapp.com",
  projectId: "trailman100-membersip-system",
  storageBucket: "trailman100-membersip-system.firebasestorage.app",
  messagingSenderId: "678783149009",
  appId: "1:678783149009:web:adcd7ebef242aed5d4b6f

    const app = initializeApp(firebaseConfig);
    const auth = getAuth(app);

    const emailInput = document.getElementById('email');
    const passwordInput = document.getElementById('password');
    const message = document.getElementById('message');

    document.getElementById('loginBtn').addEventListener('click', () => {
      message.innerText = "";
      signInWithEmailAndPassword(auth, emailInput.value, passwordInput.value)
        .then(() => { window.location.href = 'dashboard.html'; })
        .catch((err) => {
          message.className = "text-center text-sm font-medium mt-4 text-red-600";
          message.innerText = err.message;
        });
    });

    document.getElementById('forgotPasswordBtn').addEventListener('click', () => {
      message.innerText = "";
      if (!emailInput.value) {
        message.className = "text-center text-sm font-medium mt-4 text-red-600";
        message.innerText = "Please provide your email address to reset password.";
        return;
      }
      sendPasswordResetEmail(auth, emailInput.value)
        .then(() => {
          message.className = "text-center text-sm font-medium mt-4 text-green-600";
          message.innerText = "Password reset instructions sent to your inbox.";
        })
        .catch((err) => {
          message.className = "text-center text-sm font-medium mt-4 text-red-600";
          message.innerText = err.message;
        });
    });
  </script>
</body>
</html>
      <input type="text" id="profile-name" placeholder="John Doe">
      
      <label>Membership Number:</label>
      <input type="text" id="profile-number" readonly>
      
      <button id="btn-update">Update Info & Card</button>

      <h4>Your Membership Card</h4>
      <canvas id="card-canvas" width="600" height="350"></canvas>
      <br><br>
      <button id="btn-download" style="background:#28a745;">Download Card Image</button>
    </div>
  </div>

  <script type="module" src="app.js"></script>
</body>
</html>
