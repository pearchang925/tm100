<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Trailman100 - Member Login</title>
  <style>
    body { font-family: Arial, sans-serif; display: flex; justify-content: center; align-items: center; height: 100vh; margin: 0; background-color: #f4f4f9; }
    .card { background: white; padding: 30px; border-radius: 8px; box-shadow: 0 4px 10px rgba(0,0,0,0.1); width: 100%; max-width: 380px; }
    .form-group { margin-bottom: 15px; }
    .form-group label { display: block; margin-bottom: 5px; font-weight: bold; }
    .form-group input { width: 100%; padding: 10px; border: 1px solid #ccc; border-radius: 4px; box-sizing: border-box; }
    button { width: 100%; padding: 10px; background-color: #007bff; border: none; color: white; border-radius: 4px; cursor: pointer; font-size: 16px; }
    button:hover { background-color: #0056b3; }
    .links { text-align: center; margin-top: 15px; }
    .links a { color: #007bff; text-decoration: none; cursor: pointer; font-size: 14px; }
    #message { text-align: center; margin-top: 15px; font-weight: bold; }
  </style>
</head>
<body>

  <div class="card">
    <h2>Member Login</h2>
    <div class="form-group">
      <label>Email Address</label>
      <input type="email" id="email" required>
    </div>
    <div class="form-group">
      <label>Password</label>
      <input type="password" id="password" required>
    </div>
    <button id="loginBtn">Login</button>
    <div class="links">
      <a id="forgotPasswordBtn">Forgot Password?</a>
    </div>
    <p id="message"></p>
  </div>

  <script type="module">
    import { initializeApp } from "https://www.gstatic.com/firebasejs/10.0.0/firebase-app.js";
    import { getAuth, signInWithEmailAndPassword, sendPasswordResetEmail } from "https://www.gstatic.com/firebasejs/10.0.0/firebase-auth.js";

    const firebaseConfig = {
      apiKey: "YOUR_API_KEY", // Replace with your Web API Key from the Firebase Console
      authDomain: "trailman100-membersip-system.firebaseapp.com",
      projectId: "trailman100-membersip-system"
    };

    const app = initializeApp(firebaseConfig);
    const auth = getAuth(app);

    const emailInput = document.getElementById('email');
    const passwordInput = document.getElementById('password');
    const message = document.getElementById('message');

    // Sign in user and redirect to dashboard
    document.getElementById('loginBtn').addEventListener('click', () => {
      signInWithEmailAndPassword(auth, emailInput.value, passwordInput.value)
        .then(() => {
          window.location.href = 'dashboard.html';
        })
        .catch((err) => {
          message.style.color = "red";
          message.innerText = err.message;
        });
    });

    // Send reset link
    document.getElementById('forgotPasswordBtn').addEventListener('click', () => {
      if (!emailInput.value) {
        message.style.color = "red";
        message.innerText = "Please enter your email address first.";
        return;
      }
      sendPasswordResetEmail(auth, emailInput.value)
        .then(() => {
          message.style.color = "green";
          message.innerText = "Reset email sent! Check your inbox.";
        })
        .catch((err) => {
          message.style.color = "red";
          message.innerText = err.message;
        });
    });
  </script>
</body>
</html>
<script type="module">
  import { initializeApp } from "https://www.gstatic.com/firebasejs/10.0.0/firebase-app.js";
  import { getAuth, signInWithEmailAndPassword, sendPasswordResetEmail } from "https://www.gstatic.com/firebasejs/10.0.0/firebase-auth.js";

// Your Firebase configuration
const firebaseConfig = {
  apiKey: "AIzaSyA_XnffybaryptukW63qojheCXy4terHqM",
  authDomain: "trailman100-membersip-system.firebaseapp.com",
  projectId: "trailman100-membersip-system",
  storageBucket: "trailman100-membersip-system.firebasestorage.app",
  messagingSenderId: "678783149009",
  appId: "1:678783149009:web:adcd7ebef242aed5d4b6f0"
};

  // Initialize Firebase and Auth
  const app = initializeApp(firebaseConfig);
  const auth = getAuth(app);

  const emailInput = document.getElementById('email');
  const passwordInput = document.getElementById('password');
  const messageText = document.getElementById('message');

  // Handle Login
  document.getElementById('loginBtn').addEventListener('click', () => {
    const email = emailInput.value;
    const password = passwordInput.value;

    signInWithEmailAndPassword(auth, email, password)
      .then((userCredential) => {
        messageText.style.color = "green";
        messageText.innerText = "Login successful! Welcome, " + userCredential.user.email;
        // Redirect to your member dashboard here
      })
      .catch((error) => {
        messageText.style.color = "red";
        messageText.innerText = `Error: ${error.message}`;
      });
  });

  // Handle Password Reset
  document.getElementById('forgotPasswordBtn').addEventListener('click', () => {
    const email = emailInput.value;
    if (!email) {
      messageText.style.color = "red";
      messageText.innerText = "Please enter your email address first.";
      return;
    }

    sendPasswordResetEmail(auth, email)
      .then(() => {
        messageText.style.color = "green";
        messageText.innerText = "Password reset email sent! Check your inbox.";
      })
      .catch((error) => {
        messageText.style.color = "red";
        messageText.innerText = `Error: ${error.message}`;
      });
  });
</script>

</body>
</html>
