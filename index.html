<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Member Login</title>
  <style>
    .login-container { max-width: 400px; margin: 50px auto; padding: 20px; border: 1px solid #ccc; border-radius: 8px; }
    .form-group { margin-bottom: 15px; }
    .form-group label { display: block; margin-bottom: 5px; }
    .form-group input { width: 100%; padding: 8px; box-sizing: border-box; }
    button { width: 100%; padding: 10px; margin-top: 10px; cursor: pointer; }
    .links { margin-top: 15px; text-align: center; }
    .links a { color: #007bff; text-decoration: none; cursor: pointer; }
  </style>
</head>
<body>

<div class="login-container">
  <h2>Member Login</h2>
  <div class="form-group">
    <label for="email">Email Address</label>
    <input type="email" id="email" required>
  </div>
  <div class="form-group">
    <label for="password">Password</label>
    <input type="password" id="password" required>
  </div>
  
  <button id="loginBtn">Login</button>
  
  <div class="links">
    <a id="forgotPasswordBtn">Forgot Password?</a>
  </div>
  <p id="message" style="color: red; text-align: center;"></p>
</div>

<script type="module">
  import { initializeApp } from "https://www.gstatic.com/firebasejs/10.0.0/firebase-app.js";
  import { getAuth, signInWithEmailAndPassword, sendPasswordResetEmail } from "https://www.gstatic.com/firebasejs/10.0.0/firebase-auth.js";

// Your Firebase configuration
const firebaseConfig = {
  apiKey: "AIzaSyA_XnffybaryptukW63qojheCXy4terHqM",
  authDomain: "trailman100-membersip-system.firebaseapp.com",
  projectId: "trailman100-membersip-system",
  storageBucket: "trailman100-membersip-system.firebasestorage.app",
  messagingSenderId: "678783149009",
  appId: "1:678783149009:web:adcd7ebef242aed5d4b6f0"
};

  // Initialize Firebase and Auth
  const app = initializeApp(firebaseConfig);
  const auth = getAuth(app);

  const emailInput = document.getElementById('email');
  const passwordInput = document.getElementById('password');
  const messageText = document.getElementById('message');

  // Handle Login
  document.getElementById('loginBtn').addEventListener('click', () => {
    const email = emailInput.value;
    const password = passwordInput.value;

    signInWithEmailAndPassword(auth, email, password)
      .then((userCredential) => {
        messageText.style.color = "green";
        messageText.innerText = "Login successful! Welcome, " + userCredential.user.email;
        // Redirect to your member dashboard here
      })
      .catch((error) => {
        messageText.style.color = "red";
        messageText.innerText = `Error: ${error.message}`;
      });
  });

  // Handle Password Reset
  document.getElementById('forgotPasswordBtn').addEventListener('click', () => {
    const email = emailInput.value;
    if (!email) {
      messageText.style.color = "red";
      messageText.innerText = "Please enter your email address first.";
      return;
    }

    sendPasswordResetEmail(auth, email)
      .then(() => {
        messageText.style.color = "green";
        messageText.innerText = "Password reset email sent! Check your inbox.";
      })
      .catch((error) => {
        messageText.style.color = "red";
        messageText.innerText = `Error: ${error.message}`;
      });
  });
</script>

</body>
</html>
